# Mises à jour automatiques des dépendances (correctifs de sécurité)
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
  - package-ecosystem: npm
    directory: /backend
    target-branch: backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
